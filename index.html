<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amerika Yangiliklari</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#1d4ed8;--bd:#e4e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1f2a;--tx:#eceff4;--mut:#9aa3b2;--ac:#7aa2ff;--bd:#2b3140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,serif}
.w{max-width:760px;margin:auto;padding:16px}h1{margin:8px 0 2px;font-size:1.7rem}
.s{color:var(--mut);font:.85rem system-ui,sans-serif}
input{width:100%;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;font-size:.9rem}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
article{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.t{font:600 .72rem system-ui,sans-serif;color:var(--ac);text-transform:uppercase}
h2{margin:6px 0;font-size:1.15rem;line-height:1.3}p{margin:6px 0}
a{color:var(--ac);font:.85rem system-ui,sans-serif}
.en{color:var(--mut);font:.75rem system-ui,sans-serif}
</style></head><body><div class="w">
<h1>🇺🇸 Amerika Yangiliklari</h1>
<div class="s" id="u">Yuklanmoqda…</div>
<input id="q" type="search" placeholder="Qidirish…">
<div class="tabs" id="tabs"></div>
<div id="l"></div></div>
<script>
var D=[],cur="Hammasi";
function dec(s){var t=document.createElement("textarea");t.innerHTML=String(s);return t.value}
function esc(s){return dec(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function show(){var q=document.getElementById("q").value.toLowerCase();
var cats=["Hammasi"];D.forEach(function(n){if(cats.indexOf(n.cat)<0)cats.push(n.cat)});
document.getElementById("tabs").innerHTML=cats.map(function(c){return '<button data-c="'+esc(c)+'" class="'+(c===cur?"on":"")+'">'+esc(c)+'</button>'}).join("");
document.getElementById("l").innerHTML=D.filter(function(n){return(cur==="Hammasi"||n.cat===cur)&&(dec(n.title)+dec(n.summary)).toLowerCase().indexOf(q)>-1}).map(function(n){
return '<article><div class="t">'+esc(n.cat)+' · '+esc(n.source)+' · '+esc(n.date)+'</div><h2>'+esc(n.title)+'</h2><p>'+esc(n.summary)+'</p>'+(n.ok===false?'<div class="en">Tarjima kutilmoqda (hozircha inglizcha)</div>':'')+'<a href="'+esc(n.link)+'" target="_blank" rel="noopener">Asl maqola (inglizcha) →</a></article>'}).join("")}
document.getElementById("tabs").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cur=c;show()}});
var last="";
function load(){fetch("news.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
if(d.updated===last)return;last=d.updated;D=d.items;
document.getElementById("u").textContent="Oxirgi yangilik: "+d.updated+" · Tarjima avtomatik · Sahifa o‘zi yangilanadi";show()})
.catch(function(){if(!last)document.getElementById("u").textContent="Yangiliklar hali yuklanmagan. Birozdan keyin qayta urinib ko‘ring."})}
load();setInterval(load,300000);
document.getElementById("q").addEventListener("input",show);
</script></body></html>
